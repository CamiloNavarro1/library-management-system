services:
  database:
    image: postgres:16
    container_name: library-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password

    volumes:
      - library_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U library_user -d library_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - library-network

  backend:
    build:
      context: ./library-backend
      dockerfile: Dockerfile

    container_name: library-backend
    restart: unless-stopped

    environment:
      DB_URI: jdbc:postgresql://database:5432/library_db
      DB_USER: library_user
      DB_PASSWORD: library_password
      JPA_DDL_AUTO: update
      SHOW_SQL: "false"
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - library-network

  frontend:
    build:
      context: ./library-frontend
      dockerfile: Dockerfile

    container_name: library-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - library-network

volumes:
  library_postgres_data:

networks:
  library-network:
    driver: bridge